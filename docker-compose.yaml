services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/raulciucalau/conduit-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - database
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8000"

  frontend:
    image: ghcr.io/raulciucalau/conduit-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  postgres_data:
