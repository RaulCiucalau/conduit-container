services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./conduit-backend
    restart: unless-stopped
    depends_on:
      - database
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit_password
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"

volumes:
  postgres_data: