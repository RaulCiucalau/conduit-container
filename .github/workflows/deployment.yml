name: Conduit Deployment

on:
  push:
    branches:
      - feature/conduit-deployment

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./conduit-backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/conduit-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./conduit-frontend
          push: true
          build-args: |
            FRONTEND_API_URL=http://example.com:8000/api
          tags: ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest